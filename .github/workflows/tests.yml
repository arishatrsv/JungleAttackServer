name: Java Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Compile and Test
    runs-on: ubuntu-latest

    steps:
      - name: Download Server repository
        uses: actions/checkout@v4

      - name: Download Common repository
        uses: actions/checkout@v4
        with:
          repository: arishatrsv/JungleAttackCommon
          path: JungleAttackCommon

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Common dependency
        run: mvn --batch-mode -f JungleAttackCommon/pom.xml clean install

      - name: Compile and test Server
        run: mvn --batch-mode clean verify
